name: Build ZenkaiOS Cinnamon ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'auto/config'
      - 'config/package-lists/zenkaios.list.chroot'
      - 'config/hooks/normal/**'
      - '.github/workflows/build-cinnamon-iso.yml'

permissions:
  contents: read

concurrency:
  group: zenkaios-cinnamon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cinnamon:
    name: Build Cinnamon Edition (Debian Trixie / AMD64)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build inside native Debian Trixie
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/build" \
            -w /build \
            debian:trixie \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
                ca-certificates
              test -f config/package-lists/zenkaios.list.chroot
              grep -qx "linux-image-amd64" config/package-lists/zenkaios.list.chroot
              grep -qx "cinnamon-core" config/package-lists/zenkaios.list.chroot
              chmod +x config/hooks/normal/*.hook.chroot
              sh ./auto/config
              lb build
              ISO="$(find . -maxdepth 2 -type f -name "*.iso" -print -quit)"
              test -n "$ISO"
              mkdir -p dist
              cp "$ISO" dist/ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-amd64.iso
              test -s dist/ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-amd64.iso
              sha256sum dist/ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-amd64.iso | tee dist/SHA256SUMS.txt
              ls -lh dist/
            '

      - name: Upload verified ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-ISO
          path: dist/
          if-no-files-found: error
          retention-days: 14

  boot-smoke-test:
    name: BIOS boot smoke test (QEMU)
    needs: build-cinnamon
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-ISO
          path: dist

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Validate ISO and attempt BIOS boot
        shell: bash
        run: |
          set -euo pipefail
          ISO="dist/ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-amd64.iso"
          test -s "$ISO"
          file "$ISO"
          xorriso -indev "$ISO" -report_el_torito plain
          set +e
          timeout 90s qemu-system-x86_64 \
            -machine accel=tcg \
            -m 3072 \
            -smp 2 \
            -cdrom "$ISO" \
            -boot d \
            -display none \
            -serial file:dist/qemu-bios-serial.log \
            -monitor none \
            -no-reboot
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ] && [ "$STATUS" -ne 0 ]; then
            echo "QEMU exited unexpectedly: $STATUS"
            cat dist/qemu-bios-serial.log || true
            exit 1
          fi
          echo "QEMU remained running for the 90-second BIOS smoke-test window."
          echo "This verifies ISO boot handoff only; it does not certify Cinnamon desktop or UEFI."

  uefi-boot-smoke-test:
    name: UEFI boot smoke test (QEMU / OVMF)
    needs: build-cinnamon
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-ISO
          path: dist

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso

      - name: Validate UEFI boot entry and start virtual machine
        shell: bash
        run: |
          set -euo pipefail
          ISO="dist/ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-amd64.iso"
          test -s "$ISO"
          xorriso -indev "$ISO" -report_el_torito plain | tee dist/uefi-el-torito.txt
          grep -Eiq 'UEFI|EFI' dist/uefi-el-torito.txt
          OVMF_CODE="$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -n1 || true)"
          OVMF_VARS="$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -n1 || true)"
          test -n "$OVMF_CODE"
          test -n "$OVMF_VARS"
          cp "$OVMF_VARS" dist/OVMF_VARS.fd
          set +e
          timeout 90s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 3072 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=dist/OVMF_VARS.fd \
            -cdrom "$ISO" -boot d \
            -display none -serial file:dist/qemu-uefi-serial.log \
            -monitor none -no-reboot
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ] && [ "$STATUS" -ne 0 ]; then
            cat dist/qemu-uefi-serial.log || true
            exit 1
          fi
          echo "QEMU remained running for the 90-second UEFI smoke-test window."
          echo "This checks UEFI boot handoff, not successful Cinnamon desktop login."

  graphical-desktop-smoke-test:
    name: Cinnamon graphical desktop smoke test (QEMU)
    needs: build-cinnamon
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-ISO
          path: dist

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3-pil

      - name: Boot graphical live system and capture framebuffer
        shell: bash
        run: |
          set -euo pipefail
          ISO="dist/ZenkaiOS-Cinnamon-Trixie-Alpha-0.2-amd64.iso"
          test -s "$ISO"
          qemu-system-x86_64 -machine q35,accel=tcg -m 4096 -smp 2 \
            -cdrom "$ISO" -boot d -vga std -display none \
            -monitor unix:dist/qemu-monitor.sock,server=on,wait=off \
            -serial file:dist/qemu-graphical-serial.log -no-reboot \
            >/dev/null 2>&1 &
          QEMU_PID=$!
          trap 'kill "$QEMU_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            [ -S dist/qemu-monitor.sock ] && break
            sleep 1
          done
          test -S dist/qemu-monitor.sock
          sleep 100
          python3 - <<'PY'
          import socket, time
          s=socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect("dist/qemu-monitor.sock")
          time.sleep(1)
          s.recv(4096)
          s.sendall(b"screendump dist/cinnamon-screen.ppm\n")
          time.sleep(3)
          s.close()
          PY
          test -s dist/cinnamon-screen.ppm
          python3 - <<'PY'
          from PIL import Image, ImageStat
          im=Image.open("dist/cinnamon-screen.ppm").convert("RGB")
          stat=ImageStat.Stat(im)
          extrema=im.getextrema()
          print("Framebuffer:", im.size, "RGB extrema:", extrema, "mean:", stat.mean)
          if max(stat.mean) < 2 or max(max(c) for c in extrema) < 8:
              raise SystemExit("Framebuffer appears completely black")
          print("A non-black graphical framebuffer was captured.")
          PY
          echo "Framebuffer capture is a visual smoke test, not proof that Cinnamon is fully usable."
