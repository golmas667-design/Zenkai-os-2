name: Build ZenkaiOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auto/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools

      - name: Configure Debian Live
        run: sudo ./auto/config

      - name: Build ISO
        run: sudo lb build

      - name: Prepare ISO artifact
        run: |
          ISO="$(find . -maxdepth 2 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          mkdir -p dist
          cp "$ISO" dist/ZenkaiOS-Alpha-0.1-amd64.iso
          sha256sum dist/ZenkaiOS-Alpha-0.1-amd64.iso | tee dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenkaiOS-Alpha-0.1-ISO
          path: dist/
          if-no-files-found: error
          retention-days: 14
